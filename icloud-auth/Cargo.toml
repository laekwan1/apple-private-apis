[package]
name = "icloud_auth"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde = { version = "1.0.147", features = ["derive"] }
serde_json = { version = "1.0.87" }
base64 = "0.13.1"
srp = { version = "0.6.0", path = "./rustcrypto-srp" }
pbkdf2 = { version = "0.11.0" }
sha2 = { version = "0.10.6" }
rand = { version = "0.8.5" }
rustls = { version = "0.20.7" }
rustls-pemfile = { version = "1.0.1" }
plist = { version = "1.3.1" }
hmac = "0.12.1"
num-bigint = "0.4.3"
cbc = { version = "0.1.2", features = ["std"] }
aes = "0.8.2"
pkcs7 = "0.3.0"
# [Shard patch] default-tls(=iOS 네이티브 Security.framework)는 로그인 TLS ClientHello 지문을 iOS가 만들어,
# iOS 26.6.1이 26.4.1과 다른 지문을 내보내 gsa.apple.com이 HTML 503으로 거부하는 것으로 추정(전수조사 결론).
# rustls로 바꾸면 iOS 버전과 무관한 고정 지문이라 두 iOS가 동일하게 취급된다. 애플 루트 CA는 client.rs가 이미 추가.
reqwest = { version = "0.11.14", default-features = false, features = ["blocking", "json", "rustls-tls"] }
omnisette = {path = "../omnisette", features = ["remote-anisette-v3"]}
thiserror = "1.0.58"
tokio = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
